name: Release UI packages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: immutable-ui-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xgc-team/xgc2-images/xgc2-build-noble-dev:1.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Trust the workspace in the build image
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Validate, build, and publish the immutable family
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/publish-immutable-release.mjs
          --family package
          --source-sha "$GITHUB_SHA"
          --evidence-dir "$RUNNER_TEMP/ui-package-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --executor github-actions
          --publish
