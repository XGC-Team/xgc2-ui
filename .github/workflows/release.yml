name: Release UI packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Validate annotated release tag
        run: |
          set -euo pipefail
          if ! git cat-file -e "${GITHUB_REF_NAME}^{tag}" 2>/dev/null; then
            echo "release tag ${GITHUB_REF_NAME} must be annotated" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not resolve to the checked-out commit" >&2
            exit 1
          fi
      - name: Pack only packages changed since the preceding immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '[.[] | select(.draft == false and (.tag_name | test("^v[0-9]")))] | first | .tag_name // ""')"
          for package in tokens react workflow; do
            if [[ -n "${previous_tag}" ]] && git diff --quiet "${previous_tag}" "${GITHUB_REF_NAME}" -- \
              "packages/${package}" \
              ":(exclude)packages/${package}/CHANGELOG.md"; then
              echo "reusing unchanged @xgc2/ui-${package} from ${previous_tag}"
              continue
            fi
            if [[ -n "${previous_tag}" ]] && git cat-file -e "${previous_tag}:packages/${package}/package.json" 2>/dev/null; then
              current_version="$(node -p "require('./packages/${package}/package.json').version")"
              previous_version="$(git show "${previous_tag}:packages/${package}/package.json" | node -e "let source=''; process.stdin.on('data', (chunk) => { source += chunk; }); process.stdin.on('end', () => process.stdout.write(JSON.parse(source).version));")"
              if [[ "${current_version}" == "${previous_version}" ]]; then
                echo "@xgc2/ui-${package} changed since ${previous_tag} without a version bump (${current_version})" >&2
                exit 1
              fi
            fi
            pnpm --filter "@xgc2/ui-${package}" pack --pack-destination release-assets
          done
          if ! compgen -G 'release-assets/*.tgz' >/dev/null; then
            echo "release has no changed package assets" >&2
            exit 1
          fi
      - name: Reject an existing release or asset namespace
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TAG_CREATED: ${{ github.event.created }}
        run: |
          set -euo pipefail
          if [[ "${TAG_CREATED}" != "true" || "${RUN_ATTEMPT}" != "1" ]]; then
            echo "release tags are immutable; only the first run for a newly created tag may publish" >&2
            exit 1
          fi
          release_error="$(mktemp)"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" >/dev/null 2>"${release_error}"; then
            echo "release already exists: ${GITHUB_REF_NAME}" >&2
            exit 1
          elif ! grep -Fq '(HTTP 404)' "${release_error}"; then
            cat "${release_error}" >&2
            echo "could not prove that the release namespace is unused" >&2
            exit 1
          fi
          package_version="$(node -p "require('./packages/react/package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${package_version}" >&2
            exit 1
          fi
          expected_assets=()
          for package in tokens react workflow; do
            name="$(node -p "require('./packages/${package}/package.json').name.replace(/^@/, '').replace('/', '-')")"
            version="$(node -p "require('./packages/${package}/package.json').version")"
            asset="${name}-${version}.tgz"
            if [[ -f "release-assets/${asset}" ]]; then
              expected_assets+=("${asset}")
            fi
          done
          mapfile -t built_assets < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected_assets < <(printf '%s\n' "${expected_assets[@]}" | sort)
          if [[ "${built_assets[*]}" != "${expected_assets[*]}" ]]; then
            printf 'unexpected release assets: %s\n' "${built_assets[*]}" >&2
            exit 1
          fi
          published_assets_file="$(mktemp)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | .assets[]? | .name' >"${published_assets_file}"
          mapfile -t published_assets <"${published_assets_file}"
          for asset in "${expected_assets[@]}"; do
            if printf '%s\n' "${published_assets[@]}" | grep -Fqx -- "${asset}"; then
              echo "asset namespace already exists: ${asset}" >&2
              exit 1
            fi
          done
      - name: Publish immutable package assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/*.tgz --verify-tag --generate-notes
